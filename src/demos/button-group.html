<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Button Group Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-button-group'] {
            display: flex;
            flex-direction: row;
          }

          [is='back-button-group'] > button {
            appearance: none;
            border: 1px solid #1252ff;
            padding: 0.75rem 1rem;
            background: white;
            color: #1252ff;
            font: inherit;
            font-weight: 800;
          }

          [is='back-button-group'] > button + button {
            margin-inline-start: -1px;
          }
        }

        @layer experimental {
          [is='back-button-group'] {
            --axis: attr(data-axis type(<custom-ident>), inline);

            flex-direction: if(style(--axis: block): column; else: row);
          }

          [is='back-button-group'] > button {
            --position: attr(data-position type(<custom-ident>), single);
            --radius: 0.75rem;

            border-radius: if(
              style(--position: single): var(--radius) ; style((--position: first) and (--axis: inline)): var(--radius) 0 0 var(--radius) ; style((--position: last) and (--axis: inline)): 0
                var(--radius) var(--radius) 0; style((--position: first) and (--axis: block)): var(--radius) var(--radius) 0 0; style((--position: last) and (--axis: block)): 0 0 var(--radius)
                var(--radius) ; else: 0;
            );

            margin-inline-start: if(style((--axis: inline) and ((--position: middle) or (--position: last))): -1px; else: 0;);

            margin-block-start: if(style((--axis: block) and ((--position: middle) or (--position: last))): -1px; else: 0;);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-stack">
      <div is="back-button-group" data-axis="inline">
        <button data-position="first">Left</button>
        <button data-position="middle">Center</button>
        <button data-position="last">Right</button>
      </div>
      <div is="back-button-group" data-axis="block">
        <button data-position="first">Top</button>
        <button data-position="middle">Middle</button>
        <button data-position="last">Bottom</button>
      </div>
    </div>
  </body>
</html>
