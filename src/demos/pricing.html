<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Pricing Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-plan'] {
            position: relative;
            inline-size: min(20rem, 88vw);
            min-block-size: 15rem;
            padding: 2rem;
            border: 1px solid #eaecf0;
            border-radius: 1.5rem;
            background: white;
            box-shadow: 0 1rem 2rem rgb(16 24 40 / 0.08);
          }

          [is='back-plan'] h2 {
            margin: 0 0 0.5rem;
            color: #101828;
          }

          [is='back-plan'] p {
            margin: 0;
            color: #475467;
          }

          [is='back-plan']::after {
            content: '';
            display: block;
            inline-size: 40%;
            block-size: 0.35rem;
            margin-block-start: 2rem;
            border-radius: 999px;
            background: #1252ff;
          }
        }

        @layer experimental {
          [is='back-plan'] {
            --plan: attr(data-plan type(<custom-ident>), starter);
            --popular: attr(data-popular type(<custom-ident>), false);
            --discount: attr(data-discount type(<number>), 0);

            --accent: if(style(--plan: starter): #2fbfff; style(--plan: pro): #1252ff; style(--plan: enterprise): #7b4fff; else: #667085;);

            border-color: if(style(--popular: true): var(--accent) ; else: #eaecf0);
            box-shadow: if(style(--popular: true): 0 1.5rem 3rem --alpha(var(--accent), 0.24) ; else: 0 0.5rem 1.5rem rgb(16 24 40 / 0.06) ;);
          }

          [is='back-plan']::before {
            content: if(style(--popular: true): 'Most popular' ; else: '');
            position: absolute;
            inset-block-start: 1rem;
            inset-inline-end: 1rem;
            padding: 0.35rem 0.65rem;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            font-size: 0.8rem;
            font-weight: 900;
          }

          [is='back-plan']::after {
            inline-size: --progress(var(--discount));
            background: var(--accent);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-stack">
      <article is="back-plan" data-plan="starter" data-popular="false" data-discount="0">
        <h2>Starter</h2>
        <p>For small experiments.</p>
      </article>
      <article is="back-plan" data-plan="pro" data-popular="true" data-discount="20">
        <h2>Pro</h2>
        <p>For real product teams.</p>
      </article>
      <article is="back-plan" data-plan="enterprise" data-popular="false" data-discount="35">
        <h2>Enterprise</h2>
        <p>For complex organizations.</p>
      </article>
    </div>
  </body>
</html>
