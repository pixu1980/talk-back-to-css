<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Button Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-button'] {
            appearance: none;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            padding: 0.9rem 1.4rem;
            background: #1252ff;
            color: white;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 1rem 2rem rgb(18 82 255 / 0.18);
          }
        }

        @layer experimental {
          [is='back-button'] {
            --tone: attr(data-tone type(<custom-ident>), brand);
            --size: attr(data-size type(<number>), 3);
            --radius: attr(data-radius px, 12px);

            --accent: if(style(--tone: danger): #d92d20; style(--tone: success): #079455; style(--tone: ghost): transparent; else: #1252ff;);

            --text: if(style(--tone: ghost): #1252ff; else: white;);

            border-color: if(style(--tone: ghost): #1252ff; else: transparent);
            border-radius: var(--radius);
            padding: --space(var(--size)) --space(calc(var(--size) * 2));
            background: var(--accent);
            color: var(--text);
          }

          [is='back-button']:hover {
            box-shadow: --ring(4px, --alpha(var(--accent), 0.2));
          }
        }
      }
    </style>
  </head>
  <body>
    <p class="demo-note">The HTML API is made of typed attributes. CSS reads `data-tone`, `data-size`, and `data-radius`.</p>
    <div class="demo-stack">
      <button is="back-button" data-tone="brand" data-size="3" data-radius="12">Save changes</button>
      <button is="back-button" data-tone="danger" data-size="3" data-radius="999">Delete project</button>
      <button is="back-button" data-tone="ghost" data-size="2" data-radius="8">Cancel</button>
    </div>
  </body>
</html>
