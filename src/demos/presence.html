<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Presence Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-presence'] {
            position: relative;
            inline-size: 72px;
            block-size: 72px;
            margin: 0;
            border-radius: 50%;
            box-shadow: 0 0 0 4px #667085;
          }

          [is='back-presence']::after {
            content: '';
            position: absolute;
            inset-block-end: 0;
            inset-inline-end: 0;
            inline-size: 22%;
            block-size: 22%;
            border-radius: 50%;
            background: #667085;
            box-shadow: 0 0 0 3px white;
          }

          [is='back-presence'] > img {
            display: block;
            inline-size: 100%;
            block-size: 100%;
            border-radius: inherit;
            object-fit: cover;
            background: linear-gradient(135deg, #2fbfff, #7b4fff);
          }
        }

        @layer experimental {
          [is='back-presence'] {
            --status: attr(data-status type(<custom-ident>), offline);
            --size: attr(data-size px, 72px);
            --ring-size: attr(data-ring px, 4px);

            --accent: if(style(--status: online): #079455; style(--status: busy): #f79009; else: #667085;);

            inline-size: var(--size);
            block-size: var(--size);
            box-shadow: --ring(var(--ring-size), var(--accent));
          }

          [is='back-presence']::after {
            background: var(--accent);
            animation: if(media(prefers-reduced-motion: reduce): none; style(--status: online): --motion(presence-pulse, 1.4s) ; else: none;);
          }
        }

        @keyframes presence-pulse {
          50% {
            scale: 1.25;
            opacity: 0.6;
          }
        }
      }
    </style>
  </head>
  <body>
    <p class="demo-note">One component, three states. The online one animates only when motion is allowed.</p>
    <div class="demo-stack">
      <figure is="back-presence" data-status="online" data-size="88" data-ring="5">
        <img
          src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20stop-color%3D%22%232fbfff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237b4fff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2246%22%20r%3D%2222%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3Cpath%20d%3D%22M22%20112c8-28%2028-42%2038-42s30%2014%2038%2042%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3C/svg%3E"
          alt="Online avatar"
        />
      </figure>
      <figure is="back-presence" data-status="busy" data-size="88" data-ring="5">
        <img
          src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20stop-color%3D%22%232fbfff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237b4fff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2246%22%20r%3D%2222%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3Cpath%20d%3D%22M22%20112c8-28%2028-42%2038-42s30%2014%2038%2042%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3C/svg%3E"
          alt="Busy avatar"
        />
      </figure>
      <figure is="back-presence" data-status="offline" data-size="88" data-ring="5">
        <img
          src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20stop-color%3D%22%232fbfff%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237b4fff%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20fill%3D%22url%28%23g%29%22/%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2246%22%20r%3D%2222%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3Cpath%20d%3D%22M22%20112c8-28%2028-42%2038-42s30%2014%2038%2042%22%20fill%3D%22%23fff%22%20opacity%3D%22.92%22/%3E%3C/svg%3E"
          alt="Offline avatar"
        />
      </figure>
    </div>
  </body>
</html>
