<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back to CSS - Clock Tower Lightning</title>
    <style>
      @layer reset, tokens, functions, fallback, future, scene;

      @layer reset {
        * {
          box-sizing: border-box;
        }
        body {
          min-block-size: 100svh;
          margin: 0;
          overflow: hidden;
          display: grid;
          place-items: center;
          font-family:
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: white;
          background: #050713;
        }
        button {
          font: inherit;
        }
      }

      @layer tokens {
        :root {
          --strike-time: 4s;
          --voltage: 1210;
          --tower-scale: 1;
          --cyan: #2fbfff;
          --blue: #1252ff;
          --purple: #7b4fff;
          --gold: #ffbf2f;
          --brick: #604436;
        }
      }

      @layer functions {
        @function --flash-alpha(--voltage <number>: 1210) returns <number> {
          result: calc(clamp(0, var(--voltage), 1210) / 1210);
        }
        @function --zap-color(--voltage <number>: 1210) returns <color> {
          result: oklch(88% 0.17 230 / calc(clamp(0, var(--voltage), 1210) / 1210));
        }
        @function --strike(--time <time>: 4s) {
          result: lightning var(--time) steps(1) infinite;
        }
      }

      @layer fallback {
        [is='clock-lightning'] {
          --duration: var(--strike-time);
          --power: var(--voltage);
          --scale: var(--tower-scale);
        }
      }

      @layer future {
        [is='clock-lightning'] {
          --duration: attr(data-strike-time s, 4s);
          --power: attr(data-voltage type(<number>), 1210);
          --scale: attr(data-scale type(<number>), 1);
          --bolt: if(style(--power >= 1210): var(--cyan) ; style(--power >= 800): var(--gold) ; else: var(--purple) ;);
        }
      }

      @layer scene {
        [is='clock-lightning'] {
          position: fixed;
          inset: 0;
          isolation: isolate;
          overflow: hidden;
          display: grid;
          place-items: end center;
          background: radial-gradient(circle at 50% 18%, rgb(47 191 255 / 0.14), transparent 24rem), linear-gradient(#07091a 0 60%, #0b0e18 60% 100%);
        }

        [is='clock-lightning']::before {
          content: '';
          position: absolute;
          inset: 0;
          z-index: 4;
          pointer-events: none;
          background: white;
          opacity: 0;
          animation: flash var(--duration) steps(1) infinite;
        }

        [data-part='clouds'] {
          position: absolute;
          inset-inline: -10%;
          inset-block-start: -8%;
          block-size: 38%;
          background:
            radial-gradient(ellipse at 12% 80%, rgb(74 88 121 / 0.9) 0 12%, transparent 13%), radial-gradient(ellipse at 34% 72%, rgb(45 55 84 / 0.9) 0 20%, transparent 21%),
            radial-gradient(ellipse at 56% 76%, rgb(68 79 112 / 0.86) 0 18%, transparent 19%), radial-gradient(ellipse at 82% 70%, rgb(39 48 78 / 0.9) 0 22%, transparent 23%);
          filter: blur(8px);
          animation: clouds 18s linear infinite alternate;
        }

        [data-part='bolt'] {
          position: absolute;
          inline-size: 11rem;
          block-size: 30rem;
          inset-inline-start: 50%;
          inset-block-start: 4%;
          translate: -48% 0;
          clip-path: polygon(44% 0, 60% 0, 49% 30%, 70% 30%, 39% 100%, 46% 48%, 29% 48%);
          background: linear-gradient(#fff, var(--cyan), #fff);
          filter: drop-shadow(0 0 16px #fff) drop-shadow(0 0 46px var(--cyan));
          opacity: 0;
          animation: lightning var(--duration) steps(1) infinite;
        }

        [data-part='cable'] {
          position: absolute;
          inline-size: 38rem;
          block-size: 12rem;
          inset-inline-start: 50%;
          inset-block-start: 37%;
          translate: -50% 0;
          border-block-start: 4px solid rgb(47 191 255 / 0.38);
          border-radius: 50% 50% 0 0;
          filter: drop-shadow(0 0 14px var(--cyan));
          animation: cable-hot var(--duration) steps(1) infinite;
        }

        [data-part='tower'] {
          position: relative;
          inline-size: calc(24rem * var(--scale));
          block-size: calc(34rem * var(--scale));
          margin-block-end: 0;
          transform-origin: 50% 100%;
          filter: drop-shadow(0 2rem 2rem rgb(0 0 0 / 0.5));
        }

        [data-part='spire'] {
          position: absolute;
          inline-size: 6rem;
          block-size: 5rem;
          inset-inline-start: 50%;
          inset-block-start: 0;
          translate: -50% 0;
          clip-path: polygon(50% 0, 100% 100%, 0 100%);
          background: linear-gradient(#101828, #030712);
        }

        [data-part='face'] {
          position: absolute;
          inline-size: 15rem;
          block-size: 16rem;
          inset-inline-start: 50%;
          inset-block-start: 4.6rem;
          translate: -50% 0;
          border: 0.7rem solid #2d1b15;
          border-radius: 1.1rem;
          background: repeating-linear-gradient(0deg, rgb(255 255 255 / 0.05) 0 8px, transparent 8px 16px), linear-gradient(135deg, #7d5742, #3c271e);
        }

        [data-part='clock'] {
          position: absolute;
          inline-size: 9.4rem;
          aspect-ratio: 1;
          inset-inline-start: 50%;
          inset-block-start: 6.5rem;
          translate: -50% 0;
          border: 0.42rem solid #f8e4b1;
          border-radius: 50%;
          background:
            radial-gradient(circle, #2d1b15 0 4%, transparent 5%),
            conic-gradient(from 0turn, #f8e4b1 0 2%, #fff7dd 2% 8.33%, #f8e4b1 8.33% 10.33%, #fff7dd 10.33% 16.66%, #f8e4b1 16.66% 18.66%, #fff7dd 18.66%);
          box-shadow:
            inset 0 0 2rem rgb(0 0 0 / 0.36),
            0 0 2rem rgb(255 191 47 / 0.3);
        }

        [data-part='clock']::before,
        [data-part='clock']::after {
          content: '';
          position: absolute;
          inset-inline-start: 50%;
          inset-block-start: 50%;
          inline-size: 0.35rem;
          background: #2d1b15;
          border-radius: 999px;
          transform-origin: 50% 100%;
        }

        [data-part='clock']::before {
          block-size: 3rem;
          transform: translate(-50%, -100%) rotate(120deg);
        }

        [data-part='clock']::after {
          block-size: 3.8rem;
          transform: translate(-50%, -100%) rotate(24deg);
        }

        [data-part='building'] {
          position: absolute;
          inset-inline: 2rem;
          inset-block: 18rem 0;
          background: repeating-linear-gradient(0deg, rgb(255 255 255 / 0.06) 0 6px, transparent 6px 12px), linear-gradient(135deg, #76513e, #332018);
          border-inline: 0.65rem solid #2d1b15;
        }

        [data-part='door'] {
          position: absolute;
          inline-size: 6rem;
          block-size: 7rem;
          inset-inline-start: 50%;
          inset-block-end: 0;
          translate: -50% 0;
          border-radius: 3rem 3rem 0 0;
          background: linear-gradient(#1b120e, #050505);
          box-shadow: inset 0 0 1.5rem rgb(47 191 255 / 0.18);
        }

        [data-part='spark'] {
          position: absolute;
          inline-size: 2.2rem;
          aspect-ratio: 1;
          inset-inline-start: 50%;
          inset-block-start: 37%;
          translate: -50% -50%;
          border-radius: 50%;
          background: radial-gradient(circle, #fff, var(--cyan), transparent 68%);
          filter: drop-shadow(0 0 24px #fff) drop-shadow(0 0 52px var(--cyan));
          opacity: 0;
          animation: spark var(--duration) steps(1) infinite;
        }

        [data-part='spec'] {
          position: fixed;
          inset-inline-start: 1rem;
          inset-block-end: 1rem;
          max-inline-size: 44rem;
          padding: 0.85rem 1rem;
          border: 1px solid rgb(47 191 255 / 0.4);
          border-radius: 0.85rem;
          background: rgb(5 7 19 / 0.76);
          font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
          color: #c8f2ff;
        }

        [data-action='audio'] {
          position: fixed;
          inset-inline-end: 1rem;
          inset-block-end: 1rem;
          padding: 0.75rem 1rem;
          border: 1px solid rgb(47 191 255 / 0.72);
          border-radius: 999px;
          background: rgb(47 191 255 / 0.16);
          color: white;
          cursor: pointer;
        }

        @keyframes clouds {
          to {
            translate: 4% 0;
          }
        }
        @keyframes lightning {
          0%,
          76%,
          82%,
          100% {
            opacity: 0;
          }
          77%,
          79%,
          81% {
            opacity: 1;
          }
        }
        @keyframes flash {
          0%,
          76%,
          82%,
          100% {
            opacity: 0;
          }
          77% {
            opacity: 0.72;
          }
          79% {
            opacity: 0.28;
          }
          81% {
            opacity: 0.5;
          }
        }
        @keyframes spark {
          0%,
          75%,
          83%,
          100% {
            opacity: 0;
            scale: 0.2;
          }
          77%,
          82% {
            opacity: 1;
            scale: 1.9;
          }
        }
        @keyframes cable-hot {
          0%,
          74%,
          84%,
          100% {
            filter: drop-shadow(0 0 8px rgb(47 191 255 / 0.2));
          }
          77%,
          82% {
            filter: drop-shadow(0 0 30px var(--cyan)) drop-shadow(0 0 80px white);
          }
        }
      }
    </style>
  </head>
  <body>
    <main is="clock-lightning" data-audio-root data-strike-time="4" data-voltage="1210" data-scale="1">
      <div data-part="clouds"></div>
      <div data-part="bolt"></div>
      <div data-part="cable"></div>
      <div data-part="spark"></div>
      <section data-part="tower" aria-label="CSS drawn clock tower">
        <div data-part="spire"></div>
        <div data-part="face"></div>
        <div data-part="clock"></div>
        <div data-part="building"></div>
        <div data-part="door"></div>
      </section>
      <p data-part="spec">Clock tower demo: data-strike-time="4", data-voltage="1210". Audio: generated thunder, electrical crackle and bell hits.</p>
      <button type="button" data-action="audio">Start sound</button>
    </main>
    <script>
      const audioButton = document.querySelector('[data-action="audio"]');
      const root = document.querySelector('[data-audio-root]');
      let audioContext;
      let running = false;

      function createContext() {
        audioContext ??= new AudioContext();
        return audioContext;
      }

      function envGain(context, destination, start, attack, decay, peak = 0.18) {
        const gain = context.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(peak, start + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + attack + decay);
        gain.connect(destination);
        return gain;
      }

      function tone(context, destination, frequency, start, duration, type = 'sawtooth', gain = 0.14) {
        const oscillator = context.createOscillator();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, start);
        const envelope = envGain(context, destination, start, 0.02, duration, gain);
        oscillator.connect(envelope);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.08);
      }

      function noise(context, destination, start, duration, gain = 0.18) {
        const buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
        const data = buffer.getChannelData(0);
        for (let index = 0; index < data.length; index += 1) {
          data[index] = Math.random() * 2 - 1;
        }
        const source = context.createBufferSource();
        source.buffer = buffer;
        const filter = context.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(900, start);
        filter.frequency.exponentialRampToValueAtTime(80, start + duration);
        const envelope = envGain(context, destination, start, 0.005, duration, gain);
        source.connect(filter);
        filter.connect(envelope);
        source.start(start);
        source.stop(start + duration);
      }

      function pulseCssState(attribute) {
        document.documentElement.toggleAttribute(attribute, true);
        window.setTimeout(() => document.documentElement.toggleAttribute(attribute, false), 2400);
      }

      audioButton?.addEventListener('click', async () => {
        const context = createContext();
        if (context.state === 'suspended') {
          await context.resume();
        }
        running = !running;
        audioButton.textContent = running ? 'Stop sound' : 'Start sound';
        root?.toggleAttribute('data-playing', running);
        if (running) {
          window.playScene?.(context);
        }
      });

      window.playScene = function playScene(context) {
        const destination = context.destination;
        const now = context.currentTime + 0.04;
        tone(context, destination, 392, now, 0.7, 'triangle', 0.06);
        tone(context, destination, 196, now + 0.24, 1.1, 'triangle', 0.05);
        noise(context, destination, now + 1.8, 1.5, 0.28);
        [880, 1174.66, 1567.98].forEach((frequency, index) => {
          tone(context, destination, frequency, now + 1.72 + index * 0.05, 0.16, 'square', 0.05);
        });
        if (running) window.setTimeout(() => window.playScene(context), 4100);
      };
    </script>
  </body>
</html>
