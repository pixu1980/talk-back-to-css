<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Grid Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-grid'] {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
            inline-size: min(62rem, 92vw);
          }

          [is='back-grid'] > article {
            min-block-size: 8rem;
            padding: 1.25rem;
            border-radius: 1rem;
            background: white;
            box-shadow: 0 1rem 2rem rgb(16 24 40 / 0.08);
            font-weight: 800;
          }
        }

        @layer experimental {
          [is='back-grid'] {
            --columns: attr(data-cols type(<integer>), 3);
            --gap-step: attr(data-gap type(<number>), 4);
            --density: attr(data-density type(<custom-ident>), comfortable);

            gap: --space(var(--gap-step));
            grid-template-columns: if(media(width < 700px): 1fr; else: repeat(var(--columns), minmax(0, 1fr)) ;);
          }

          [is='back-grid'] > article {
            padding: if(style(--density: compact): --space(3) ; else: --space(6));
          }
        }
      }
    </style>
  </head>
  <body>
    <section is="back-grid" data-cols="4" data-gap="4" data-density="comfortable">
      <article>Design tokens</article>
      <article>Components</article>
      <article>Patterns</article>
      <article>Guidelines</article>
    </section>
  </body>
</html>
