<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Meter Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-meter'] {
            display: grid;
            gap: 0.5rem;
            min-inline-size: min(30rem, 82vw);
          }

          [is='back-meter']::before {
            content: attr(data-label);
            font-weight: 800;
          }

          [is='back-meter']::after {
            content: '';
            display: block;
            inline-size: 100%;
            block-size: 0.9rem;
            border-radius: 999px;
            background: linear-gradient(90deg, #1252ff 0 50%, #eaecf0 0);
            box-shadow: inset 0 0 0 1px #d0d5dd;
          }
        }

        @layer experimental {
          [is='back-meter'] {
            --value: attr(data-value type(<number>), 0);
            --state: attr(data-state type(<custom-ident>), info);

            --accent: if(style(--state: danger): #d92d20; style(--state: warning): #f79009; style(--state: success): #079455; else: #1252ff;);
          }

          [is='back-meter']::after {
            background: linear-gradient(90deg, var(--accent) 0 --progress(var(--value)), #eaecf0 0);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-column">
      <div is="back-meter" data-label="Build health" data-value="82" data-state="success"></div>
      <div is="back-meter" data-label="Storage usage" data-value="64" data-state="warning"></div>
      <div is="back-meter" data-label="Error budget" data-value="24" data-state="danger"></div>
    </div>
  </body>
</html>
