<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Back Callout Demo</title>
    <style>
      @layer reset, base, functions, fallback;

      @layer reset {
        * {
          box-sizing: border-box;
        }

        html {
          color-scheme: light;
        }

        body {
          min-block-size: 100svh;
          margin: 0;
          padding: 2rem;
          display: grid;
          place-content: center;
          gap: 1rem;
          font-family:
            Inter,
            ui-sans-serif,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #101828;
          background: radial-gradient(circle at 12% 12%, rgb(47 191 255 / 0.24), transparent 20rem), radial-gradient(circle at 90% 18%, rgb(123 79 255 / 0.2), transparent 24rem), #f6f7fb;
        }
      }

      @layer base {
        .demo-note {
          max-inline-size: 68ch;
          margin: 0 auto 1rem;
          color: #475467;
          text-align: center;
          line-height: 1.45;
        }

        .demo-stack {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 1rem;
        }

        .demo-column {
          display: grid;
          gap: 1rem;
        }
      }

      @layer functions {
        @function --space(--step <number>: 4) returns <length> {
          result: calc(var(--step) * 0.25rem);
        }

        @function --alpha(--color <color>, --alpha <number>: 0.16) returns <color> {
          result: oklch(from var(--color) l c h / var(--alpha));
        }

        @function --progress(--value <number>: 0) returns <percentage> {
          result: calc(clamp(0, var(--value), 100) * 1%);
        }

        @function --ring(--size <length>, --color <color>) {
          result: 0 0 0 var(--size) var(--color);
        }

        @function --motion(--name, --duration <time>: 800ms) {
          result: var(--name) var(--duration) ease-in-out infinite;
        }
      }

      @layer experimental {
        @layer fallback {
          [is='back-callout'] {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 1rem;
            align-items: start;
            max-inline-size: 42rem;
            padding: 1.25rem;
            border: 1px solid rgb(18 82 255 / 0.35);
            border-radius: 1rem;
            background: rgb(18 82 255 / 0.08);
          }

          [is='back-callout']::before {
            content: attr(data-icon);
            display: grid;
            place-items: center;
            inline-size: 2rem;
            block-size: 2rem;
            border-radius: 50%;
            background: #1252ff;
            color: white;
            font-weight: 900;
          }
        }

        @layer experimental {
          [is='back-callout'] {
            --tone: attr(data-tone type(<custom-ident>), info);
            --emphasis: attr(data-emphasis type(<custom-ident>), soft);
            --gap: attr(data-gap type(<number>), 4);

            --accent: if(style(--tone: warning): #f79009; style(--tone: danger): #d92d20; style(--tone: success): #079455; else: #1252ff;);

            --surface: if(style(--emphasis: solid): var(--accent) ; else: --alpha(var(--accent), 0.12) ;);

            --ink: if(style(--emphasis: solid): white; else: #101828);

            gap: --space(var(--gap));
            padding: --space(var(--gap));
            border-color: --alpha(var(--accent), 0.4);
            background: var(--surface);
            color: var(--ink);
          }

          [is='back-callout']::before {
            background: var(--accent);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-column">
      <aside is="back-callout" data-tone="warning" data-emphasis="soft" data-gap="5" data-icon="⚠">
        <strong>Experimental CSS ahead.</strong><br />
        Use this demo in a controlled browser environment.
      </aside>
      <aside is="back-callout" data-tone="success" data-emphasis="solid" data-gap="4" data-icon="✓">
        <strong>Progressive enhancement ready.</strong><br />
        The base UI remains readable.
      </aside>
    </div>
  </body>
</html>
